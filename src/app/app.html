<div class="d-flex min-vh-100 bg-light">
  <!-- BARRA LATERAL (SIDEBAR) CONTABLE DEFINITIVA LIMPIA -->
  @if (mostrarSidebar()) {
    <div
      class="bg-dark text-white border-end d-flex flex-column justify-content-between p-3"
      style="width: 260px; min-width: 260px"
    >
      <!-- SECCIÓN SUPERIOR: NAVEGACIÓN PRINCIPAL -->
      <div>
        <div class="d-flex align-items-center gap-2 mb-4 pb-2 border-bottom border-secondary">
          <i class="bi bi-shield-lock-fill text-primary fs-4"></i>
          <span class="fw-bold fs-5 tracking-wide">SigoCartera</span>
        </div>

        <ul class="nav nav-pills flex-column gap-1.5 small mb-3">
          <li class="nav-item">
            <a
              class="nav-link text-white d-flex align-items-center gap-2 py-2 cursor-pointer btn-moneda-nav"
              [class.active-gtq]="monedaGlobal === 'GTQ'"
              (click)="cambiarMonedaGlobal('GTQ')"
            >
              <i class="bi bi-currency-exchange text-success"></i> Ver Matriz Quetzales
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link text-white d-flex align-items-center gap-2 py-2 cursor-pointer btn-moneda-nav"
              [class.active-usd]="monedaGlobal === 'USD'"
              (click)="cambiarMonedaGlobal('USD')"
            >
              <i class="bi bi-cash-stack text-primary"></i> Ver Matriz Dólares
            </a>
          </li>
          <hr class="border-secondary my-2" />
          <li class="nav-item">
            <a
              class="nav-link text-white d-flex align-items-center gap-2 py-2"
              routerLink="/carga-excel"
              routerLinkActive="active bg-primary"
            >
              <i class="bi bi-file-earmark-arrow-up-fill text-warning"></i> Carga Mensual Excel
            </a>
          </li>
        </ul>
      </div>

      <!-- SECCIÓN INFERIOR: IDENTIDAD DEL USUARIO Y LOGOUT (REUBICADA AL FONDO DIRECTAMENTE) -->
      <div
        class="p-2 bg-secondary bg-opacity-25 rounded d-flex align-items-center justify-content-between border border-secondary"
      >
        <div class="d-flex align-items-center gap-2 text-truncate me-2">
          <div
            class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold small"
            style="width: 32px; height: 32px; min-width: 32px"
          >
            A
          </div>
          <div class="text-truncate">
            <span class="d-block fw-bold text-white small text-truncate">{{ usuarioNombre }}</span>
            <span class="d-block text-muted font-mono" style="font-size: 0.65rem"
              >Sesión Segura</span
            >
          </div>
        </div>
        <button
          type="button"
          (click)="ejecutarCerrarSesion()"
          class="btn btn-sm btn-outline-danger border-0 p-1.5 d-flex align-items-center justify-content-center rounded-circle"
          title="Cerrar Sesión"
        >
          <i class="bi bi-box-arrow-left fs-5"></i>
        </button>
      </div>
    </div>
  }

  <!-- CONTENEDOR DE PANTALLAS DINÁMICAS (DASHBOARD) -->
  <div class="flex-grow-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>
