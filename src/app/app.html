<div class="d-flex w-100">
  <!-- El Sidebar solo se renderiza si mostrarSidebar es TRUE -->
  <app-sidebar *ngIf="mostrarSidebar"></app-sidebar>

  <!-- Añadimos una clase dinámica [class.login-full-width] si el Sidebar está oculto -->
  <main class="content-wrapper flex-grow-1 bg-light min-vh-100" [class.login-full-width]="!mostrarSidebar">
    <router-outlet></router-outlet>
  </main>
</div>
