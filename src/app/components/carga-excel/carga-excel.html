<div class="container p-4 font-sans text-start">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      
      <!-- CARD CONTENEDORA -->
      <div class="card shadow border-0 rounded p-4 bg-white mt-4">
        <div class="text-center mb-4">
          <i class="bi bi-file-earmark-arrow-up text-primary display-4"></i>
          <h3 class="fw-bold text-dark mt-2">Carga Mensual Masiva</h3>
          <p class="text-muted small">Suba el archivo consolidado de facturación de agencias para actualizar la matriz dinámica.</p>
        </div>

        <!-- REQUISITOS DEL EXCEL -->
        <div class="alert alert-light border small text-secondary mb-4 py-2 px-3">
          <strong class="text-dark d-block mb-1">Estructura esperada del archivo:</strong>
          Las columnas de la primera fila deben llamarse: <code class="text-primary fw-bold">NIT</code>, <code class="text-primary fw-bold">CLIENTE</code>, <code class="text-primary fw-bold">MARCA</code>, <code class="text-primary fw-bold">FACTURA</code>, <code class="text-primary fw-bold">MONEDA</code>, <code class="text-primary fw-bold">MONTO</code>.
        </div>

        <!-- FORMULARIO DE CARGA -->
        <div class="mb-3">
          <label class="form-label fw-bold small text-dark">Seleccionar archivo Excel (.xlsx):</label>
          <input 
            type="file" 
            class="form-control form-control-sm" 
            accept=".xlsx, .xls"
            (change)="onArchivoCambio($event)"
            [disabled]="cargando"
          />
        </div>

        <!-- MENSAJE DE ESTADO -->
        @if (mensajeEstado) {
          <div class="text-center mb-3 p-2 rounded small fw-semibold" 
               [ngClass]="mensajeEstado.includes('Error') ? 'bg-danger-subtle text-danger':'bg-light text-primary border'">
            {{ mensajeEstado }}
          </div>
        }

        <!-- ACCIONES -->
        <div class="d-grid gap-2 mt-2">
          <button 
            type="button" 
            (click)="subirYProcesarCartera()" 
            class="btn btn-primary fw-bold"
            [disabled]="cargando || !archivoSeleccionado"
          >
            @if (cargando) {
              <span class="spinner-border spinner-border-sm me-1"></span> Procesando...
            } @else {
              <i class="bi bi-cloud-upload-fill me-1"></i> Procesar Facturación Masiva
            }
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
