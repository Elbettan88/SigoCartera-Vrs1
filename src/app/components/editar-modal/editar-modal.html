<div
  class="modal fade show d-block"
  tabindex="-1"
  style="background: rgba(0, 0, 0, 0.5)"
  role="dialog"
>
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-dark text-white py-2 px-3">
        <h6 class="modal-title fw-bold m-0 fs-7">
          ✏️ Modificar {{ esMarca ? 'Marca' : 'Cliente' }}
        </h6>
        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cerrar()"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body p-3 font-sans small text-secondary">
        <form (ngSubmit)="guardar()">
          <div class="mb-2">
            <label class="form-label fw-bold mb-1 text-dark">
              {{ esMarca ? 'Nombre de la Marca*' : 'Razón Social / Empresa*' }}
            </label>
            <input
              type="text"
              class="form-control form-control-sm font-sans"
              [(ngModel)]="nombreEntidad"
              name="entidadNom"
              required
            />
          </div>

          @if (esMarca) {
            <div class="mb-3">
              <label class="form-label fw-bold mb-1 text-dark">Código Interno</label>
              <input
                type="text"
                class="form-control form-control-sm font-mono"
                [(ngModel)]="codigoInternoAdicional"
                name="entidadInt"
              />
            </div>
          }

          <div class="d-flex justify-content-end gap-2 pt-2 border-top mt-3">
            <button type="button" class="btn btn-xs btn-outline-secondary px-3" (click)="cerrar()">
              Cancelar
            </button>
            <button type="submit" class="btn btn-xs btn-dark px-3 fw-bold">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
